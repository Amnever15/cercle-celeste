<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05020F" id="theme-color-meta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manuscrits">
  <title>Les Manuscrits Célestes</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cercle.theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var m = document.getElementById('theme-color-meta');
        if (m) m.setAttribute('content', t === 'light' ? '#F4EFE4' : '#05020F');
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sky-nebula"></div>
    <div class="sky-stars" id="sky-stars"></div>
    <div class="sky-dust"></div>
  </div>
  <div id="app"></div>
  <script src="app.js?v=22"></script>
</body>
</html>
